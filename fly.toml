# Public demo (stand-in chain). Deploy: fly launch --copy-config --no-deploy (first time, pick a unique name), then fly deploy
app = "zvm-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
